<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="KzMufPWiBQGWTYkrNuZEMmMAvzH1C07OTqr4Zvykxa8" />
    <title>Loading Lincoln's Ultimate...</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffafcc;
            font-family: 'Arial Rounded MT Bold', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        h1 {
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 175, 204, 0.5);
        }

        .progress-bg {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #e0b0ff;
            height: 25px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 15px rgba(224, 176, 255, 0.2);
        }

        .progress-fill {
            background: linear-gradient(90deg, #7bf1a8, #fff3b0);
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .status-text {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #7bf1a8;
            font-weight: bold;
        }

        .float {
            animation: floating 2s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="loader-container">
    <h1 class="float">LOADING...</h1>
    <div class="progress-bg">
        <div class="progress-fill" id="fill"></div>
    </div>
    <p class="status-text" id="status">Waking up Lincoln...</p>
</div>

<script>
    // --- SETTINGS ---
    const loadingEnabled = true; // Set to false to stop the loading from completing
    const totalTime = 3000; 
    
    const messages = [
        "Waking up Lincoln...",
        "Polishing Golden Tortas...",
        "Hiding Easter Eggs...",
        "Charging up Click Power...",
        "Preparing the Candy Workshop..."
    ];

    let progress = 0;
    const fillElement = document.getElementById('fill');
    const statusElement = document.getElementById('status');
    
    const intervalTime = 30; 
    const step = 100 / (totalTime / intervalTime);

    const loadingInterval = setInterval(() => {
        // Only increase progress if loadingEnabled is true
        if (loadingEnabled) {
            progress += step;
            fillElement.style.width = Math.min(progress, 100) + "%";

            if (Math.random() > 0.95) {
                statusElement.innerText = messages[Math.floor(Math.random() * messages.length)];
            }

            if (progress >= 100) {
                clearInterval(loadingInterval);
                statusElement.innerText = "READY!";
                statusElement.style.color = "#fff3b0";
                
                setTimeout(() => {
                    window.location.href = "game.html";
                }, 300);
            }
        } else {
            // If loading is disabled, show a "System Paused" message
            statusElement.innerText = "SYSTEM PAUSED - PLEASE WAIT";
            statusElement.style.color = "#ff6b6b";
        }
    }, intervalTime);
</script>

</body>
</html>
