<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Down | Lincoln Clicker</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0a0a0a;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        /* The "Blurry" background version of your site */
        .site-screenshot {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: url('IMG_0718.jpeg');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.4);
            z-index: 1;
        }

        .maintenance-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: white;
        }

        #lincoln-down {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid #ffcc00;
            margin-bottom: 20px;
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.2);
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            color: #ffcc00;
            text-shadow: 2px 2px 10px #000;
            margin: 0;
        }

        p {
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
        }

        /* CAUTION TAPE */
        .caution-tape {
            position: absolute;
            width: 150%;
            height: 60px;
            background: #ffcc00;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 40px,
                #000 40px,
                #000 80px
            );
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 20;
            white-space: nowrap;
            overflow: hidden;
        }

        .tape-1 { top: 30%; transform: rotate(-10deg) translateX(-10%); }
        .tape-2 { bottom: 30%; transform: rotate(10deg) translateX(-10%); }

        @keyframes slide {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .tape-text {
            animation: slide 10s linear infinite;
        }
    </style>
</head>
<body>

    <div class="site-screenshot"></div>

    <div class="caution-tape tape-1">
        <div class="tape-text">CAUTION &nbsp;&nbsp; WEBSITE DOWN &nbsp;&nbsp; MASS GRIND PAUSED &nbsp;&nbsp; CAUTION &nbsp;&nbsp; WEBSITE DOWN &nbsp;&nbsp; </div>
    </div>
    <div class="caution-tape tape-2">
        <div class="tape-text">DO NOT CROSS &nbsp;&nbsp; UNDER MAINTENANCE &nbsp;&nbsp; LINCOLN IS TIRED &nbsp;&nbsp; DO NOT CROSS &nbsp;&nbsp; </div>
    </div>

    <div class="maintenance-container">
        <img src="IMG_0668.jpg" id="lincoln-down">
        <h1>Website Currently Down</h1>
        <p>We are currently upgrading the Torta Factory. <br>Please check back later to resume the grind.</p>
    </div>

    <script>
        // Set this to false when you want the site to come back up!
        const isDown = true;

        if (!isDown) {
            window.location.href = "index.html"; 
        }
    </script>
</body>
</html>
