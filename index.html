<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Down | Lincoln Clicker</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0a0a0a;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        .site-screenshot {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: url('IMG_0718.jpeg');
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.3);
            z-index: 1;
        }

        .maintenance-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        #lincoln-down {
            width: 180px; /* Smaller base size */
            height: 180px;
            max-width: 40vw; /* Responsive scaling */
            max-height: 40vw;
            border-radius: 50%;
            border: 5px solid #ffcc00;
            margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.4);
            object-fit: cover;
        }

        h1 {
            font-size: clamp(1.5rem, 8vw, 3.5rem); /* Auto-scales font size */
            text-transform: uppercase;
            color: #ffcc00;
            text-shadow: 3px 3px 15px #000;
            margin: 0 0 10px 0;
        }

        p {
            font-size: clamp(0.9rem, 4vw, 1.3rem); /* Auto-scales font size */
            background: rgba(0,0,0,0.85);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #444;
            max-width: 600px;
            line-height: 1.4;
        }

        /* RESPONSIVE CAUTION TAPE */
        .caution-tape {
            position: absolute;
            width: 200%;
            height: clamp(40px, 8vw, 70px); /* Height scales with screen */
            background: #ffcc00;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 40px,
                #000 40px,
                #000 80px
            );
            display: flex;
            align-items: center;
            color: #000;
            font-weight: 900;
            font-size: clamp(1rem, 4vw, 1.8rem); /* Text inside tape scales */
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 20;
            overflow: hidden;
        }

        .tape-1 { top: 20%; transform: rotate(-7deg) translateX(-10%); }
        .tape-2 { bottom: 20%; transform: rotate(7deg) translateX(-10%); }

        .tape-text {
            display: flex;
            white-space: nowrap;
            animation: scroll-tape 20s linear infinite;
        }

        @keyframes scroll-tape {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <div class="site-screenshot"></div>

    <div class="caution-tape tape-1">
        <div class="tape-text">
            &nbsp; WEBSITE DOWN &nbsp; CAUTION &nbsp; MASS GRIND PAUSED &nbsp; WEBSITE DOWN &nbsp; CAUTION &nbsp; MASS GRIND PAUSED &nbsp; 
        </div>
    </div>

    <div class="caution-tape tape-2">
        <div class="tape-text">
            &nbsp; DO NOT CROSS &nbsp; UNDER MAINTENANCE &nbsp; TORTA OVERLOAD &nbsp; DO NOT CROSS &nbsp; UNDER MAINTENANCE &nbsp; 
        </div>
    </div>

    <div class="maintenance-container">
        <img src="IMG_0688.jpg" id="lincoln-down">
        <h1>Website Down</h1>
        <p>The Torta Factory is currently undergoing emergency maintenance.<br>The Heavyweights will return shortly.</p>
    </div>

</body>
</html>
