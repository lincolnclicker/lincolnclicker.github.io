<!DOCTYPE html>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0a0a0a;
            font-family: 'Arial Rounded MT Bold', 'Arial Black', sans-serif;
            overflow: hidden;
        }

        .site-screenshot {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: url('IMG_0718.jpeg');
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.25);
            z-index: 1;
            transform: scale(1.1);
        }

        .maintenance-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        #lincoln-down {
            width: 180px;
            height: 180px;
            max-width: 35vw;
            max-height: 35vw;
            border-radius: 50%;
            border: 6px solid #ffcc00;
            margin-bottom: 20px;
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.4);
            object-fit: cover;
        }

        h1 {
            font-size: clamp(1.8rem, 8vw, 3.8rem);
            text-transform: uppercase;
            color: #ffcc00;
            text-shadow: 3px 3px 20px #000;
            margin: 0 0 15px 0;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #444;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        #timer {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(1.4rem, 6vw, 2.2rem);
            color: #ffcc00;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        /* Maintenance Log Styling */
        .log-container {
            margin-top: 25px;
            font-family: 'Courier New', monospace;
            color: #55efc4;
            font-size: 0.75rem;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border-left: 3px solid #55efc4;
            width: fit-content;
            max-width: 80%;
            text-transform: uppercase;
        }

        .caution-tape {
            position: absolute;
            width: 250%;
            height: clamp(45px, 9vw, 80px);
            background: #ffcc00;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 40px, #000 40px, #000 80px);
            display: flex;
            align-items: center;
            color: #000;
            font-weight: 900;
            font-size: clamp(1.1rem, 4.5vw, 2rem);
            text-transform: uppercase;
            z-index: 20;
            overflow: hidden;
        }

        .tape-1 { top: 18%; transform: rotate(-8deg) translateX(-15%); }
        .tape-2 { bottom: 18%; transform: rotate(8deg) translateX(-15%); }

        .tape-text {
            display: flex;
            white-space: nowrap;
            animation: scroll-tape 25s linear infinite;
        }

        @keyframes scroll-tape {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <div class="site-screenshot"></div>

            if (distance > 0) {
                display.innerHTML = (days<10?"0"+days:days)+"d "+(hours<10?"0"+hours:hours)+"h "+(minutes<10?"0"+minutes:minutes)+"m "+(seconds<10?"0"+seconds:seconds)+"s";

        }, 1000);

            "Patching the gravy boat...", "Refilling the soda fountain...", "Sharpening the pizza cutter...", "Calibrating the fry timer...", "Stabilizing the burger stack...",
            "Expanding the kitchen floor...", "Adding more butter...", "Testing fork durability...", "Washing the chef's hat...", "Rerouting power to the toaster...",
            "Sifting the flour...", "Ordering more bacon...", "Marinating the steaks...", "Peeling 5000 potatoes...", "Unclogging the milkshake straw...",
            "Monitoring glucose spikes...", "Adjusting the salt shaker...", "Defrosting the giant freezer...", "Organizing the spice rack...", "Cleaning the grease trap...",
            "Leveling the dining tables...", "Fixing the neon sign...", "Rotating the donut display...", "Double-checking the order tickets...", "Training the new Chuds...",

            "Resting the meat...", "Checking the internal temp...", "Packaging the leftovers...", "Final safety inspection...", "Ready for Monday..."

        let logIdx = 0;
        setInterval(() => {

</body>
